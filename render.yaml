services:
  - type: web
    name: dakar-dem-dikk-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: GEMINI_API_KEY
        sync: false        # À renseigner dans le dashboard Render
      - key: REFRESH_TOKEN
        sync: false        # À renseigner dans le dashboard Render
      - key: SKIP_MODEL
        value: "1"         # Désactiver SentenceTransformer si GPU non disponible
    healthCheckPath: /health
